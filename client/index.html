<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/mint/favicon.ico" sizes="any">
    <link rel="icon" href="/mint/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allagaroo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@400;600;700;800;900&family=Rubik:wght@500;700&display=swap">
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #1B1026;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      transition: opacity 0.4s ease;
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #splash.gone {
      display: none;
    }
    #splash img {
      width: min(340px, 72vw);
      height: auto;
    }
  </style>
  </head>
  <body>
    <div id="splash">
      <img src="/mint/logo/svg/allagaroo-logo.svg" alt="Allagaroo — Play Anything" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
