<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Third Edge</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0B0F1A;--surface:#131929;--surface2:#1A2236;--border:rgba(255,255,255,.08);
  --accent:#6366F1;--green:#10B981;--red:#EF4444;--yellow:#F59E0B;--gold:#D4AF37;
  --text:#E2E8F0;--muted:#64748B;
  --living:#4ADE80;--made:#60A5FA;--raw:#FB923C;
}
body{background:var(--bg);font-family:'Outfit',sans-serif;color:var(--text);min-height:100vh}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fadeIn .25s ease both}
.btn{padding:10px 22px;border-radius:10px;border:none;font-family:'Outfit',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s;letter-spacing:.4px;text-transform:uppercase}
.btn:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.35;cursor:default;transform:none!important}
.btn-primary{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff}
.btn-danger{background:rgba(239,68,68,.15);color:#EF4444;border:1px solid rgba(239,68,68,.25)}
.btn-success{background:rgba(16,185,129,.15);color:#10B981;border:1px solid rgba(16,185,129,.25)}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border)}
.btn-gold{background:rgba(212,175,55,.15);color:var(--gold);border:1px solid rgba(212,175,55,.3)}
.btn-sm{padding:6px 14px;font-size:11px;border-radius:7px}
.btn-lg{padding:14px 32px;font-size:15px}
input,select{background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;padding:10px 14px;width:100%;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--accent)}
select option{background:var(--surface2)}
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.surface{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
/* Spinner */
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
/* Family colors */
.fam-living{color:var(--living)}
.fam-made{color:var(--made)}
.fam-raw{color:var(--raw)}
.badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.badge-living{background:rgba(74,222,128,.12);color:var(--living);border:1px solid rgba(74,222,128,.2)}
.badge-made{background:rgba(96,165,250,.12);color:var(--made);border:1px solid rgba(96,165,250,.2)}
.badge-raw{background:rgba(251,146,60,.12);color:var(--raw);border:1px solid rgba(251,146,60,.2)}
/* Card Tile */
.card-tile{background:var(--surface2);border:2px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;transition:all .15s;user-select:none;position:relative}
.card-tile:hover{border-color:rgba(99,102,241,.5);background:#1e2a3d}
.card-tile.selected{border-color:var(--accent);background:rgba(99,102,241,.1)}
.card-tile.disabled{opacity:.4;cursor:default;pointer-events:none}
.card-name{font-weight:700;font-size:13px;margin-bottom:4px}
.card-stats{display:flex;gap:6px;margin-top:6px}
.stat{flex:1;text-align:center;background:rgba(255,255,255,.05);border-radius:6px;padding:3px 0}
.stat-label{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.stat-val{font-size:15px;font-weight:800;line-height:1}
.stat-val.max{color:var(--gold)}
/* Anchor display */
.anchor-area{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:56px}
.anchor-label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 16px;font-size:12px;gap:10px}
.hud-item{text-align:center}
.hud-val{font-size:18px;font-weight:800}
.hud-key{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
/* Reveal result */
.reveal-box{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:8px}
.reveal-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px}
.reveal-row + .reveal-row{border-top:1px solid rgba(255,255,255,.05)}
.hit-winner{color:var(--green);font-weight:800}
.hit-loser{color:var(--red)}
.hit-tie{color:var(--muted)}
/* Phase banner */
.phase-banner{text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:5px 12px;border-radius:8px}
.phase-opening{background:rgba(99,102,241,.12);color:var(--accent)}
.phase-commit{background:rgba(212,175,55,.12);color:var(--gold)}
.phase-reveal{background:rgba(16,185,129,.12);color:var(--green)}
.phase-over{background:rgba(239,68,68,.12);color:var(--red)}
.phase-trade{background:rgba(251,146,60,.12);color:var(--raw)}
/* Cover screen */
.cover{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px}
/* Deck picker cards */
.deck-opt{background:var(--surface2);border:2px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .15s}
.deck-opt:hover{border-color:rgba(99,102,241,.4)}
.deck-opt.selected{border-color:var(--accent);background:rgba(99,102,241,.08)}
.deck-opt-name{font-weight:700;font-size:14px;margin-bottom:4px}
.deck-opt-desc{font-size:11px;color:var(--muted)}
/* Hand grid */
.hand-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
/* Cat buttons */
.cat-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cat-btn{flex:1;min-width:80px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.4px;transition:all .15s}
.cat-btn:hover{background:rgba(99,102,241,.15);border-color:var(--accent)}
.cat-btn.selected{background:rgba(99,102,241,.2);border-color:var(--accent);color:var(--accent)}
/* Trade card list */
.trade-card-opt{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;transition:all .15s;margin-bottom:6px}
.trade-card-opt:hover{border-color:rgba(99,102,241,.4)}
.trade-card-opt.selected{border-color:var(--accent);background:rgba(99,102,241,.08)}
/* Rounds won pips */
.pips{display:flex;gap:6px;align-items:center}
.pip{width:10px;height:10px;border-radius:50%;background:var(--border)}
.pip.won{background:var(--gold)}
/* Game wrap */
.game-wrap{width:100%;max-width:740px;margin:0 auto;padding:12px 12px 80px;display:flex;flex-direction:column;gap:10px;min-height:100vh}
/* Sticky bottom action */
.action-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(11,15,26,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:12px 16px;z-index:50;display:flex;gap:8px;justify-content:center}
/* Toast */
@keyframes toast{0%{opacity:0;transform:translateX(-50%) translateY(-12px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-12px)}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--border);border-radius:10px;padding:9px 18px;z-index:9999;font-size:13px;animation:toast 3s ease forwards;white-space:nowrap}
.toast.err{border-color:rgba(239,68,68,.4);color:#EF4444}
/* Responsive */
@media(max-width:480px){.hand-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── Constants ────────────────────────────────────────────────────────────────
const FAMILIES = { Beast:"Living",Titan:"Living",Machine:"Made",Icon:"Made",Element:"Raw",Spirit:"Raw" };
const FAMILY_COLOR = { Living:"living", Made:"made", Raw:"raw" };

function familyOf(trait){ return FAMILIES[trait] || "?"; }
function famClass(trait){ return "fam-" + (FAMILY_COLOR[familyOf(trait)] || ""); }
function badgeClass(trait){ return "badge badge-" + (FAMILY_COLOR[familyOf(trait)] || ""); }

// ── API helpers ───────────────────────────────────────────────────────────────
async function api(method, path, body){
  const opts = { method, headers:{ "Content-Type":"application/json" } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function Toast({ msg, err, onDone }){
  useEffect(() => {
    const t = setTimeout(onDone, 3000);
    return () => clearTimeout(t);
  }, []);
  return <div className={"toast" + (err ? " err" : "")}>{msg}</div>;
}

function useToast(){
  const [toast, setToast] = useState(null);
  function show(msg, err=false){ setToast({ msg, err, key: Date.now() }); }
  const el = toast
    ? <Toast key={toast.key} msg={toast.msg} err={toast.err} onDone={() => setToast(null)} />
    : null;
  return [el, show];
}

// ── CardTile ──────────────────────────────────────────────────────────────────
function CardTile({ cardId, cards, selected, onClick, disabled, showFull=true }){
  const c = cards?.[cardId];
  if (!c) return <div className="card-tile disabled"><span style={{color:"var(--muted)",fontSize:11}}>{cardId}</span></div>;
  const stats = [["POW",c.power],["SPD",c.speed],["WIT",c.wit]];
  const maxVal = Math.max(c.power, c.speed, c.wit);
  const fam = familyOf(c.trait);
  return (
    <div
      className={"card-tile" + (selected?" selected":"") + (disabled?" disabled":"")}
      onClick={!disabled ? onClick : undefined}
    >
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:6}}>
        <span className="card-name">{c.name}</span>
        <span className={badgeClass(c.trait)}>{fam}</span>
      </div>
      {showFull && (
        <div className="card-stats">
          {stats.map(([l,v]) => (
            <div className="stat" key={l}>
              <div className="stat-label">{l}</div>
              <div className={"stat-val" + (v===maxVal?" max":"")}>{v}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── AnchorArea ────────────────────────────────────────────────────────────────
function AnchorArea({ cardId, cards, label }){
  const c = cards?.[cardId];
  return (
    <div className="anchor-area">
      <div className="anchor-label">{label || "Anchor"}</div>
      {c
        ? <div style={{fontWeight:700,fontSize:13}}>{c.name} <span style={{fontSize:11,color:"var(--muted)"}}>{familyOf(c.trait)}</span></div>
        : <div style={{color:"var(--muted)",fontSize:12}}>—</div>
      }
    </div>
  );
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function Hud({ ms, p1, p2 }){
  if (!ms) return null;
  const r = ms.round;
  const rw = ms.roundsWon;
  const phaseLabel = r.phase.replace("-"," ");
  const phaseClass = { opening:"phase-opening", commit:"phase-commit", reveal:"phase-reveal",
    over:"phase-over", "exhausted-tied":"phase-reveal" }[r.phase] || "phase-commit";
  return (
    <div className="hud">
      <div className="hud-item">
        <div className="hud-val">{r.index}</div>
        <div className="hud-key">Round</div>
      </div>
      <div style={{display:"flex",gap:10,alignItems:"center"}}>
        <div style={{textAlign:"right"}}>
          <div style={{fontWeight:700,fontSize:12}}>{p1?.name}</div>
          <div className="pips">
            {[0,1].map(i=><div key={i} className={"pip"+(rw[p1?.id]>i?" won":"")}/>)}
          </div>
        </div>
        <div style={{color:"var(--muted)",fontWeight:700,fontSize:11}}>vs</div>
        <div style={{textAlign:"left"}}>
          <div style={{fontWeight:700,fontSize:12}}>{p2?.name}</div>
          <div className="pips">
            {[0,1].map(i=><div key={i} className={"pip"+(rw[p2?.id]>i?" won":"")}/>)}
          </div>
        </div>
      </div>
      <div className="hud-item">
        <div className="hud-val" style={{color:"var(--gold)"}}>{r.stake}</div>
        <div className="hud-key">Stake</div>
      </div>
      <div>
        <div className={"phase-banner "+phaseClass}>{phaseLabel}</div>
      </div>
    </div>
  );
}

// ── RevealResult ──────────────────────────────────────────────────────────────
function RevealResult({ ms, p1, p2, cards }){
  const r = ms?.round;
  if (!r || r.phase !== "reveal" || !r.lastResult) return null;
  const res = r.lastResult;
  const lp  = r.lastPlayed;
  const lc  = r.lastCategories;

  // Build per-player rows
  function PlayerReveal({ pid, pname }){
    const side  = res[pid] || {};
    const cat   = lc?.[pid];
    const played = lp?.[pid];
    const c = cards?.[played];
    const won = res.winner === pid;
    const tied = !res.winner;
    return (
      <div style={{flex:1}}>
        <div style={{fontWeight:700,fontSize:12,marginBottom:6,
          color: won ? "var(--green)" : tied ? "var(--muted)" : "var(--red)"}}>
          {pname} {won ? "✓" : tied ? "—" : "✗"}
        </div>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:4}}>
          Played: <span style={{color:"var(--text)",fontWeight:600}}>{c?.name || played}</span>
          {cat && <span style={{marginLeft:6,color:"var(--accent)"}}>[ {cat.toUpperCase()} ]</span>}
        </div>
        {side.bond > 0 && <div style={{fontSize:11,color:"var(--living)"}}>Bond +{side.bond}</div>}
        {side.blocked && <div style={{fontSize:11,color:"var(--red)"}}>Blocked</div>}
        <div style={{fontSize:11,color:"var(--muted)",marginTop:4}}>
          Total {cat}: <span style={{color:"var(--text)",fontWeight:700}}>{side.total ?? "?"}</span>
        </div>
        <div style={{fontSize:13,fontWeight:700,marginTop:2,
          color: won ? "var(--green)" : tied ? "var(--muted)" : "var(--red)"}}>
          Hit: {side.hit > 0 ? "+"+side.hit : side.hit ?? 0}
        </div>
      </div>
    );
  }

  const awardMsg = res.winner
    ? `+${res.awarded} to ${res.winner === p1.id ? p1.name : p2.name}`
    : `Pot grows (stake +1)`;

  return (
    <div className="reveal-box fade">
      <div style={{display:"flex",gap:14,marginBottom:8}}>
        <PlayerReveal pid={p1.id} pname={p1.name} />
        <div style={{width:1,background:"var(--border)"}}/>
        <PlayerReveal pid={p2.id} pname={p2.name} />
      </div>
      <div style={{borderTop:"1px solid var(--border)",paddingTop:8,fontSize:12,
        color:"var(--gold)",fontWeight:700,textAlign:"center"}}>
        {awardMsg}
      </div>
    </div>
  );
}

// ── SetupScreen ───────────────────────────────────────────────────────────────
const DECK_NAMES = ["Even Hand","The Wall","Two Camps","Weighted"];

function SetupScreen({ onStart }){
  const [p1Name, setP1Name] = useState("");
  const [p2Name, setP2Name] = useState("");
  const [p1Deck, setP1Deck] = useState(DECK_NAMES[0]);
  const [p2Deck, setP2Deck] = useState(DECK_NAMES[1]);
  const [loading, setLoading] = useState(false);
  const [ToastEl, showToast] = useToast();

  async function handleStart(){
    if (!p1Name.trim() || !p2Name.trim()) { showToast("Both players need a name", true); return; }
    setLoading(true);
    try {
      const cr = await api("POST", "/api2/create", { p1Name: p1Name.trim(), p1DeckName: p1Deck });
      const jr = await api("POST", "/api2/join",   { code: cr.code, p2Name: p2Name.trim(), p2DeckName: p2Deck });
      onStart({ code: cr.code, p1Id: cr.playerId, p2Id: jr.p2Id, p1Name: p1Name.trim(), p2Name: p2Name.trim() });
    } catch(e){
      showToast(e.message, true);
    } finally { setLoading(false); }
  }

  return (
    <div className="screen">
      {ToastEl}
      <div style={{width:"100%",maxWidth:520}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{fontSize:28,fontWeight:900,letterSpacing:-1}}>Third Edge</div>
          <div style={{color:"var(--muted)",fontSize:13,marginTop:4}}>Hot-seat · 2 players · 1 device</div>
        </div>

        <div className="surface fade" style={{display:"flex",flexDirection:"column",gap:18}}>
          {/* Player 1 */}
          <div>
            <div style={{fontWeight:700,fontSize:13,marginBottom:10,color:"var(--living)"}}>Player 1</div>
            <div style={{marginBottom:10}}>
              <label>Name</label>
              <input value={p1Name} onChange={e=>setP1Name(e.target.value)} placeholder="Enter name" />
            </div>
            <label>Deck</label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {DECK_NAMES.map(d => (
                <div key={d} className={"deck-opt"+(p1Deck===d?" selected":"")} onClick={()=>setP1Deck(d)}>
                  <div className="deck-opt-name">{d}</div>
                </div>
              ))}
            </div>
          </div>

          <div style={{borderTop:"1px solid var(--border)"}}/>

          {/* Player 2 */}
          <div>
            <div style={{fontWeight:700,fontSize:13,marginBottom:10,color:"var(--made)"}}>Player 2</div>
            <div style={{marginBottom:10}}>
              <label>Name</label>
              <input value={p2Name} onChange={e=>setP2Name(e.target.value)} placeholder="Enter name" />
            </div>
            <label>Deck</label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {DECK_NAMES.map(d => (
                <div key={d} className={"deck-opt"+(p2Deck===d?" selected":"")} onClick={()=>setP2Deck(d)}>
                  <div className="deck-opt-name">{d}</div>
                </div>
              ))}
            </div>
          </div>

          <button className="btn btn-primary btn-lg" onClick={handleStart} disabled={loading} style={{width:"100%",marginTop:4}}>
            {loading ? "Starting…" : "Start Game"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── GameScreen ────────────────────────────────────────────────────────────────
function GameScreen({ gameInfo, onNewGame }){
  const { code, p1Id, p2Id, p1Name, p2Name } = gameInfo;
  const p1 = { id: p1Id, name: p1Name };
  const p2 = { id: p2Id, name: p2Name };

  const [ms, setMs] = useState(null);
  const [status, setStatus] = useState("loading");
  const [loading, setLoading] = useState(false);

  // Hot-seat active player tracking
  const [activeP, setActiveP] = useState("p1");   // "p1" | "p2"
  const [showCover, setShowCover] = useState(false);
  const [p1Submitted, setP1Submitted] = useState(false);

  // Selection state
  const [selCard, setSelCard] = useState(null);
  const [selCat, setSelCat] = useState(null);
  const [selGiveCard, setSelGiveCard] = useState(null);

  const [ToastEl, showToast] = useToast();
  const pollRef = useRef(null);

  const activePId = activeP === "p1" ? p1Id : p2Id;
  const activeName = activeP === "p1" ? p1Name : p2Name;

  // ── Poll ─────────────────────────────────────────────────────────────────
  const poll = useCallback(async () => {
    try {
      const data = await api("GET", `/api2/poll?code=${code}`);
      setStatus(data.status);
      if (data.matchState) setMs(data.matchState);
    } catch(e){ /* ignore poll errors */ }
  }, [code]);

  useEffect(() => {
    poll();
    pollRef.current = setInterval(poll, 1500);
    return () => clearInterval(pollRef.current);
  }, [poll]);

  // Reset selection when phase changes
  useEffect(() => {
    setSelCard(null); setSelCat(null); setSelGiveCard(null);
  }, [ms?.round?.phase, ms?.round?.index]);

  // ── Action helper ─────────────────────────────────────────────────────────
  async function act(action, extra = {}){
    setLoading(true);
    try {
      await api("POST", "/api2/action", { code, playerId: activePId, action, ...extra });
      await poll();
    } catch(e){
      showToast(e.message, true);
    } finally { setLoading(false); }
  }

  // ── Phase logic ───────────────────────────────────────────────────────────
  if (!ms) return (
    <div className="screen"><div className="spinner"/></div>
  );

  const r = ms.round;
  const cards = ms.cards;
  const phase = r.phase;

  // Find player slots in round
  const rp = (pid) => r.players.find(p => p.playerId === pid);
  const mySlot   = rp(activePId);
  const theirPId = activePId === p1Id ? p2Id : p1Id;
  const theirSlot = rp(theirPId);
  const theirName = activePId === p1Id ? p2Name : p1Name;

  // Match over
  if (ms.winnerId) {
    const winName = ms.winnerId === p1Id ? p1Name : p2Name;
    return (
      <div className="screen">
        {ToastEl}
        <div style={{textAlign:"center",maxWidth:400}}>
          <div style={{fontSize:48,marginBottom:8}}>🏆</div>
          <div style={{fontSize:28,fontWeight:900,marginBottom:4}}>{winName} wins!</div>
          <div style={{color:"var(--muted)",fontSize:14,marginBottom:28}}>
            {ms.roundsWon[p1Id]}-{ms.roundsWon[p2Id]} in rounds
          </div>
          <button className="btn btn-primary btn-lg" onClick={onNewGame}>New Game</button>
        </div>
      </div>
    );
  }

  // Trade phase
  if (ms.pendingTrade) {
    const trade = ms.pendingTrade;
    const winId = trade.winner;
    const winName = winId === p1Id ? p1Name : p2Name;
    const isWinner = activePId === winId;

    // The cover screen forces the winner to be on device
    if (!isWinner && !showCover) {
      // Wrong player is active — show cover to hand device to winner
      return (
        <div className="cover">
          <div style={{fontSize:22,fontWeight:800,textAlign:"center"}}>
            Hand device to<br/><span style={{color:"var(--gold)"}}>{winName}</span>
          </div>
          <div style={{color:"var(--muted)",fontSize:13}}>Round winner decides the Trade</div>
          <button className="btn btn-primary" onClick={() => { setActiveP(winId===p1Id?"p1":"p2"); }}>
            I'm {winName} →
          </button>
        </div>
      );
    }

    const myDeck = ms.round.players.find(p=>p.playerId===winId)?.hand || [];

    return (
      <div className="game-wrap fade">
        {ToastEl}
        <Hud ms={ms} p1={p1} p2={p2} />
        <div className="surface">
          <div style={{fontWeight:800,fontSize:16,marginBottom:4}}>Trade Phase</div>
          <div style={{color:"var(--muted)",fontSize:12,marginBottom:14}}>
            {winName} wins the round. Choose to Trade, Reclaim, or Decline.
          </div>

          <div style={{fontWeight:600,fontSize:12,marginBottom:8,color:"var(--muted)"}}>Your hand — pick a card to give away:</div>
          {mySlot?.hand.map(cid => (
            <div key={cid} className={"trade-card-opt"+(selGiveCard===cid?" selected":"")}
              onClick={()=>setSelGiveCard(cid===selGiveCard?null:cid)}>
              <span style={{fontWeight:600}}>{cards[cid]?.name || cid}</span>
              <span style={{fontSize:11,color:"var(--muted)"}}>{familyOf(cards[cid]?.trait)}</span>
            </div>
          ))}

          {ms.swaps?.filter(s=>s.by===winId&&!s.undone).length > 0 && (
            <div style={{marginTop:12}}>
              <div style={{fontWeight:600,fontSize:12,marginBottom:6,color:"var(--muted)"}}>Reclaim a previous trade:</div>
              {ms.swaps.map((s,i) => s.by===winId&&!s.undone ? (
                <div key={i} className={"trade-card-opt"+(selGiveCard==="reclaim:"+i?" selected":"")}
                  onClick={()=>setSelGiveCard("reclaim:"+i)}>
                  <span style={{fontSize:12}}>Reclaim: gave {cards[s.gaveCardId]?.name}, took {cards[s.tookCardId]?.name}</span>
                </div>
              ) : null)}
            </div>
          )}
        </div>

        <div className="action-bar">
          {selGiveCard?.startsWith("reclaim:") ? (
            <button className="btn btn-gold" disabled={loading}
              onClick={()=>{
                const idx = parseInt(selGiveCard.split(":")[1]);
                act("executeReclaim",{swapIndex:idx});
                setActiveP("p1"); setP1Submitted(false);
              }}>
              Reclaim Trade
            </button>
          ) : (
            <button className="btn btn-primary" disabled={!selGiveCard||loading}
              onClick={()=>{
                act("executeTrade",{giveCardId:selGiveCard});
                setActiveP("p1"); setP1Submitted(false);
              }}>
              Execute Trade
            </button>
          )}
          <button className="btn btn-ghost" disabled={loading}
            onClick={()=>{
              act("declineTrade");
              setActiveP("p1"); setP1Submitted(false);
            }}>
            Decline
          </button>
        </div>
      </div>
    );
  }

  // Cover screen between players
  if (showCover) {
    const nextName = activeP === "p1" ? p2Name : p1Name;
    return (
      <div className="cover">
        <div style={{fontSize:14,color:"var(--muted)",fontWeight:600}}>Move locked in.</div>
        <div style={{fontSize:22,fontWeight:800,textAlign:"center"}}>
          Pass device to<br/><span style={{color:"var(--accent)"}}>{nextName}</span>
        </div>
        <div style={{color:"var(--muted)",fontSize:12}}>Don't look at {activeName}'s move</div>
        <button className="btn btn-primary btn-lg" onClick={()=>{
          setShowCover(false);
          setActiveP(activeP==="p1"?"p2":"p1");
          setSelCard(null); setSelCat(null);
        }}>
          I'm {nextName} →
        </button>
      </div>
    );
  }

  // Reveal phase
  if (phase === "reveal") {
    return (
      <div className="game-wrap fade">
        {ToastEl}
        <Hud ms={ms} p1={p1} p2={p2} />
        <RevealResult ms={ms} p1={p1} p2={p2} cards={cards} />
        <div style={{margin:"6px 0",display:"flex",gap:10}}>
          {r.players.map(p => (
            <div key={p.playerId} className="surface" style={{flex:1}}>
              <div style={{fontSize:12,fontWeight:700,color:"var(--muted)",marginBottom:6}}>
                {p.playerId===p1Id?p1Name:p2Name}
              </div>
              <div style={{fontSize:12}}>Points: <strong>{p.points}</strong></div>
              <div style={{fontSize:12,color:"var(--muted)"}}>Hand: {p.handCount} · Draw: {p.drawCount}</div>
            </div>
          ))}
        </div>
        <div className="action-bar">
          <button className="btn btn-primary" disabled={loading}
            onClick={()=>{ act("advanceTurn"); setActiveP("p1"); setP1Submitted(false); }}>
            Next Turn →
          </button>
        </div>
      </div>
    );
  }

  // Opening / Commit phase — submit move
  const isOpening = phase === "opening";
  const isP1Turn = activeP === "p1";

  // Check if both submitted (only possible if we know from server — in hot-seat both go sequentially)
  const submitMove = async () => {
    if (!selCard) { showToast("Pick a card", true); return; }
    if (!isOpening && !selCat) { showToast("Choose a category", true); return; }
    await act("submitMove", { cardId: selCard, category: isOpening ? null : selCat });
    if (isP1Turn && !p1Submitted) {
      // After P1 submits, show cover for P2
      setP1Submitted(true);
      setShowCover(true);
    } else {
      // P2 submitted — both in — server resolved — reset
      setP1Submitted(false);
      setActiveP("p1");
    }
    setSelCard(null); setSelCat(null);
  };

  const cats = ["power","speed","wit"];

  return (
    <div className="game-wrap fade">
      {ToastEl}
      <Hud ms={ms} p1={p1} p2={p2} />

      {/* Active player banner */}
      <div style={{textAlign:"center",padding:"6px 0"}}>
        <span style={{fontWeight:700,fontSize:13,color:"var(--accent)"}}>
          {activeName}'s turn {isOpening ? "(Opening — no category)" : ""}
        </span>
      </div>

      {/* Their anchor */}
      {!isOpening && theirSlot?.anchor && (
        <div>
          <div style={{fontSize:11,color:"var(--muted)",fontWeight:600,marginBottom:4}}>{theirName}'s Anchor</div>
          <AnchorArea cardId={theirSlot.anchor} cards={cards} label={theirName} />
        </div>
      )}

      {/* My anchor */}
      {!isOpening && mySlot?.anchor && (
        <AnchorArea cardId={mySlot.anchor} cards={cards} label="Your Anchor" />
      )}

      {/* Hand */}
      <div>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600,marginBottom:6,textTransform:"uppercase",letterSpacing:".5px"}}>
          Your Hand ({mySlot?.hand?.length ?? 0})
        </div>
        <div className="hand-grid">
          {mySlot?.hand?.map(cid => (
            <CardTile key={cid} cardId={cid} cards={cards}
              selected={selCard===cid}
              onClick={()=>setSelCard(cid===selCard?null:cid)}
            />
          ))}
        </div>
      </div>

      {/* Category selector (normal turns only) */}
      {!isOpening && selCard && (
        <div className="surface fade">
          <div style={{fontSize:12,fontWeight:700,marginBottom:6,color:"var(--muted)"}}>Attack category</div>
          <div className="cat-row">
            {cats.map(c => (
              <button key={c} className={"cat-btn"+(selCat===c?" selected":"")}
                onClick={()=>setSelCat(c===selCat?null:c)}>
                {c}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Discard pile */}
      {mySlot?.discard?.length > 0 && (
        <div style={{fontSize:11,color:"var(--muted)"}}>
          Discard: {mySlot.discard.map(id=>cards[id]?.name||id).join(", ")}
        </div>
      )}

      <div className="action-bar">
        <button className="btn btn-primary" disabled={!selCard || (!isOpening && !selCat) || loading}
          onClick={submitMove}>
          Lock In →
        </button>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const [gameInfo, setGameInfo] = useState(null);

  if (!gameInfo) {
    return <SetupScreen onStart={setGameInfo} />;
  }

  return <GameScreen key={gameInfo.code} gameInfo={gameInfo} onNewGame={() => setGameInfo(null)} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
