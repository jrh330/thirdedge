<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Card Lab — Third Edge</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0B0F1A;--surface:#131929;--surface2:#1A2236;--border:rgba(255,255,255,.08);
  --accent:#6366F1;--green:#10B981;--red:#EF4444;--gold:#D4AF37;
  --text:#E2E8F0;--muted:#64748B;
  --living:#4ADE80;--made:#60A5FA;--raw:#FB923C;
}
body{background:var(--bg);font-family:'Outfit',sans-serif;color:var(--text);min-height:100vh}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toast{0%{opacity:0;transform:translateX(-50%) translateY(-12px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-12px)}}
.fade{animation:fadeIn .25s ease both}
.btn{padding:10px 22px;border-radius:10px;border:none;font-family:'Outfit',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s;letter-spacing:.4px;text-transform:uppercase}
.btn:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:default;transform:none!important}
.btn-primary{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:6px 14px;font-size:11px;border-radius:7px}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;padding:10px 14px;width:100%;outline:none;transition:border-color .2s;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select option{background:var(--surface2)}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.surface{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 80px}
/* Nav */
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);margin-bottom:24px}
.nav-title{font-size:18px;font-weight:900;letter-spacing:-0.5px}
/* Trait pills */
.trait-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trait-pill{background:var(--surface2);border:2px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:center;transition:all .15s}
.trait-pill:hover{border-color:rgba(99,102,241,.4)}
.trait-pill.selected{border-color:var(--accent);background:rgba(99,102,241,.1)}
.trait-name{font-size:12px;font-weight:700}
.trait-fam{font-size:10px;margin-top:2px}
.fam-living{color:var(--living)}
.fam-made{color:var(--made)}
.fam-raw{color:var(--raw)}
/* Spinner */
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
/* Minted card display */
.minted-card{display:flex;gap:16px;align-items:flex-start}
.minted-img{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--border);flex-shrink:0;background:var(--surface2)}
.minted-img-placeholder{width:120px;height:120px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;flex-shrink:0}
.minted-info{flex:1}
.minted-name{font-size:20px;font-weight:900;margin-bottom:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.badge-living{background:rgba(74,222,128,.12);color:var(--living);border:1px solid rgba(74,222,128,.2)}
.badge-made{background:rgba(96,165,250,.12);color:var(--made);border:1px solid rgba(96,165,250,.2)}
.badge-raw{background:rgba(251,146,60,.12);color:var(--raw);border:1px solid rgba(251,146,60,.2)}
.stat-row{display:flex;gap:8px;margin-top:10px}
.stat-box{flex:1;text-align:center;background:rgba(255,255,255,.05);border-radius:8px;padding:6px 4px}
.stat-label{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.stat-val{font-size:22px;font-weight:900;line-height:1.1}
.stat-val.max{color:var(--gold)}
.reasoning{font-size:12px;color:var(--muted);margin-top:10px;font-style:italic;line-height:1.5}
/* Collection grid */
.collection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.coll-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.coll-img{width:100%;height:120px;object-fit:cover;display:block;background:var(--surface)}
.coll-img-placeholder{width:100%;height:120px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.coll-body{padding:10px 12px}
.coll-name{font-weight:700;font-size:13px;margin-bottom:4px}
.coll-stats{display:flex;gap:4px;margin-top:8px}
.coll-stat{flex:1;text-align:center;background:rgba(255,255,255,.04);border-radius:5px;padding:3px 0}
.coll-stat-label{font-size:8px;color:var(--muted);font-weight:700;text-transform:uppercase}
.coll-stat-val{font-size:14px;font-weight:800}
.coll-stat-val.max{color:var(--gold)}
/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--border);border-radius:10px;padding:9px 18px;z-index:9999;font-size:13px;animation:toast 3.5s ease forwards;white-space:nowrap}
.toast.err{border-color:rgba(239,68,68,.4);color:#EF4444}
/* Owner banner */
.owner-banner{display:flex;align-items:center;gap:10px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);border-radius:10px;padding:10px 14px;margin-bottom:20px}
.owner-name{font-weight:700;font-size:14px}
/* Deck builder */
.builder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:420px;overflow-y:auto;padding-right:4px}
.builder-card{position:relative;background:var(--surface2);border:2px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s,background .15s;user-select:none}
.builder-card:hover{border-color:rgba(99,102,241,.4)}
.builder-card.selected{border-color:var(--accent);background:rgba(99,102,241,.1)}
.builder-check{position:absolute;top:4px;right:6px;font-size:13px;font-weight:900;color:var(--accent);display:none}
.builder-card.selected .builder-check{display:block}
.saved-deck{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.saved-deck-cards{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="nav">
  <div class="nav-title">⚗️ Card Lab</div>
  <a href="/" class="btn btn-ghost btn-sm">← Play</a>
</div>

<div class="wrap">
  <!-- Identity gate -->
  <div id="identity-section">
    <div class="surface fade" style="max-width:420px;margin:60px auto">
      <div style="font-size:20px;font-weight:800;margin-bottom:6px">Welcome to the Card Lab</div>
      <div style="color:var(--muted);font-size:13px;margin-bottom:20px">Enter your name to access your collection.</div>
      <label>Your name</label>
      <input id="name-input" type="text" placeholder="e.g. jrh" maxlength="40" />
      <button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="enterLab()">Enter Lab →</button>
    </div>
  </div>

  <!-- Lab (shown after name entry) -->
  <div id="lab-section" style="display:none">

    <div class="owner-banner">
      <div style="font-size:13px;color:var(--muted)">Minting as</div>
      <div class="owner-name" id="owner-display"></div>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="changeName()">Change</button>
    </div>

    <!-- Mint form -->
    <div class="surface fade" style="margin-bottom:24px">
      <div style="font-size:16px;font-weight:800;margin-bottom:16px">Mint a New Card</div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
        <div>
          <label>Card Name</label>
          <input id="card-name" type="text" placeholder="e.g. Charles Barkley" maxlength="60" />
        </div>
        <div>
          <label>Image URL</label>
          <input id="image-url" type="url" placeholder="https://..." />
        </div>
      </div>

      <div style="margin-bottom:12px">
        <label>Trait</label>
        <div class="trait-grid" id="trait-grid">
          <div class="trait-pill" data-trait="Beast" onclick="selectTrait(this)">
            <div class="trait-name">Beast</div>
            <div class="trait-fam fam-living">Living</div>
          </div>
          <div class="trait-pill" data-trait="Titan" onclick="selectTrait(this)">
            <div class="trait-name">Titan</div>
            <div class="trait-fam fam-living">Living</div>
          </div>
          <div class="trait-pill" data-trait="Machine" onclick="selectTrait(this)">
            <div class="trait-name">Machine</div>
            <div class="trait-fam fam-made">Made</div>
          </div>
          <div class="trait-pill" data-trait="Icon" onclick="selectTrait(this)">
            <div class="trait-name">Icon</div>
            <div class="trait-fam fam-made">Made</div>
          </div>
          <div class="trait-pill" data-trait="Element" onclick="selectTrait(this)">
            <div class="trait-name">Element</div>
            <div class="trait-fam fam-raw">Raw</div>
          </div>
          <div class="trait-pill" data-trait="Spirit" onclick="selectTrait(this)">
            <div class="trait-name">Spirit</div>
            <div class="trait-fam fam-raw">Raw</div>
          </div>
        </div>
      </div>

      <div style="margin-bottom:16px">
        <label>Description <span style="color:var(--muted);font-weight:400;text-transform:none">(tell Claude about this card)</span></label>
        <textarea id="description" rows="3" maxlength="500" placeholder="Describe the card's personality, strengths, what makes it special..."></textarea>
        <div style="text-align:right;font-size:10px;color:var(--muted);margin-top:4px" id="desc-counter">0 / 500</div>
      </div>

      <button class="btn btn-primary" id="mint-btn" onclick="mintCard()" style="width:100%">
        Mint Card
      </button>

      <!-- Minted result -->
      <div id="mint-result" style="display:none;margin-top:20px;padding-top:20px;border-top:1px solid var(--border)"></div>
    </div>

    <!-- Collection -->
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div style="font-size:16px;font-weight:800">Your Collection</div>
        <button class="btn btn-ghost btn-sm" onclick="loadCollection()">Refresh</button>
      </div>
      <div id="collection-area">
        <div style="color:var(--muted);font-size:13px;margin-top:12px">Loading...</div>
      </div>
    </div>

    <!-- Decks -->
    <div style="margin-top:32px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:16px;font-weight:800">Your Decks</div>
        <button class="btn btn-ghost btn-sm" id="builder-toggle-btn" onclick="toggleBuilder()">Build a Deck</button>
      </div>

      <div id="decks-area">
        <div style="color:var(--muted);font-size:13px">Loading...</div>
      </div>

      <!-- Builder -->
      <div id="deck-builder" style="display:none;margin-top:16px">
        <div class="surface">
          <!-- Status bar -->
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">
            <div id="builder-count" style="font-size:14px;font-weight:800">0 / 12</div>
            <div id="builder-sevens" style="font-size:13px;color:var(--muted)">0 / 3 sevens</div>
            <div id="builder-warn" style="font-size:12px;color:var(--red);display:none">Max 3 sevens per deck</div>
            <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="clearSelection()">Clear all</button>
          </div>

          <!-- Card picker grid -->
          <div id="builder-grid" class="builder-grid"></div>

          <!-- Name + save -->
          <div style="display:flex;gap:8px;margin-top:14px;align-items:flex-end">
            <div style="flex:1">
              <label>Deck Name</label>
              <input id="deck-name-input" type="text" placeholder="e.g. My Beast Deck" maxlength="40" />
            </div>
            <button class="btn btn-primary" id="save-deck-btn" onclick="saveDeckSubmit()" disabled style="white-space:nowrap">Save Deck</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const FAMILIES = { Beast:"Living", Titan:"Living", Machine:"Made", Icon:"Made", Element:"Raw", Spirit:"Raw" };
const FAM_CLASS = { Living:"badge-living", Made:"badge-made", Raw:"badge-raw" };

let ownerName = localStorage.getItem("labOwner") || "";
let selectedTrait = null;
let collectionCards = [];   // cache for deck builder
let deckSelection = new Set();
let builderOpen = false;

// ── Identity ──────────────────────────────────────────────────────────────────
function enterLab() {
  const name = document.getElementById("name-input").value.trim();
  if (!name) { showToast("Enter your name", true); return; }
  ownerName = name;
  localStorage.setItem("labOwner", name);
  showLab();
}

function changeName() {
  localStorage.removeItem("labOwner");
  ownerName = "";
  document.getElementById("lab-section").style.display = "none";
  document.getElementById("identity-section").style.display = "block";
  document.getElementById("name-input").value = "";
}

function showLab() {
  document.getElementById("identity-section").style.display = "none";
  document.getElementById("lab-section").style.display = "block";
  document.getElementById("owner-display").textContent = ownerName;
  loadCollection();
  loadDecks();
}

// ── Description counter ───────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  const ta = document.getElementById("description");
  const counter = document.getElementById("desc-counter");
  ta.addEventListener("input", () => {
    counter.textContent = `${ta.value.length} / 500`;
  });
});

// Auto-enter if name already stored
if (ownerName) {
  document.addEventListener("DOMContentLoaded", showLab);
} else {
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("name-input").addEventListener("keydown", e => {
      if (e.key === "Enter") enterLab();
    });
  });
}

// ── Trait picker ──────────────────────────────────────────────────────────────
function selectTrait(el) {
  document.querySelectorAll(".trait-pill").forEach(p => p.classList.remove("selected"));
  el.classList.add("selected");
  selectedTrait = el.dataset.trait;
}

// ── Mint ──────────────────────────────────────────────────────────────────────
async function mintCard() {
  const cardName = document.getElementById("card-name").value.trim();
  const imageUrl = document.getElementById("image-url").value.trim();
  const description = document.getElementById("description").value.trim();

  if (!cardName) { showToast("Enter a card name", true); return; }
  if (!selectedTrait) { showToast("Pick a trait", true); return; }

  const btn = document.getElementById("mint-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Asking Claude…';

  try {
    const res = await fetch("/api2/mint", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ownerName, cardName, trait: selectedTrait, imageUrl, description }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Mint failed");

    showMintResult(data.card);
    loadCollection();
    // Reset form
    document.getElementById("card-name").value = "";
    document.getElementById("image-url").value = "";
    document.getElementById("description").value = "";
    document.querySelectorAll(".trait-pill").forEach(p => p.classList.remove("selected"));
    selectedTrait = null;
  } catch(e) {
    showToast(e.message, true);
  } finally {
    btn.disabled = false;
    btn.innerHTML = "Mint Card";
  }
}

function showMintResult(card) {
  const fam = FAMILIES[card.trait] || "";
  const badgeClass = FAM_CLASS[fam] || "";
  const maxStat = Math.max(card.power, card.speed, card.wits);
  const el = document.getElementById("mint-result");
  el.style.display = "block";
  el.innerHTML = `
    <div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px">✓ Card Minted</div>
    <div class="minted-card fade">
      ${card.imageUrl
        ? `<img class="minted-img" src="${esc(card.imageUrl)}" alt="${esc(card.name)}" onerror="this.style.display='none'">`
        : `<div class="minted-img-placeholder">No image</div>`}
      <div class="minted-info">
        <div class="minted-name">${esc(card.name)}</div>
        <span class="badge ${badgeClass}">${esc(card.trait)} · ${esc(fam)}</span>
        <div class="stat-row">
          <div class="stat-box">
            <div class="stat-label">POW</div>
            <div class="stat-val${card.power===maxStat?" max":""}">${card.power}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">SPD</div>
            <div class="stat-val${card.speed===maxStat?" max":""}">${card.speed}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">WIT</div>
            <div class="stat-val${card.wits===maxStat?" max":""}">${card.wits}</div>
          </div>
        </div>
        ${card.description ? `<div class="reasoning" style="color:var(--text);font-style:normal;margin-top:8px">${esc(card.description)}</div>` : ""}
        ${card.reasoning ? `<div class="reasoning">"${esc(card.reasoning)}"</div>` : ""}
      </div>
    </div>`;
}

// ── Collection ────────────────────────────────────────────────────────────────
async function loadCollection() {
  const area = document.getElementById("collection-area");
  area.innerHTML = '<div style="color:var(--muted);font-size:13px;margin-top:12px">Loading…</div>';
  try {
    const res = await fetch(`/api2/collection?owner=${encodeURIComponent(ownerName)}`);
    const data = await res.json();
    if (!data.cards?.length) {
      collectionCards = [];
      area.innerHTML = '<div style="color:var(--muted);font-size:13px;margin-top:12px">No cards yet. Mint your first one above.</div>';
      if (builderOpen) renderBuilderGrid();
      return;
    }
    collectionCards = data.cards;
    area.innerHTML = `<div class="collection-grid">${data.cards.map(renderCollCard).join("")}</div>`;
    if (builderOpen) renderBuilderGrid();
  } catch(e) {
    area.innerHTML = `<div style="color:var(--red);font-size:13px;margin-top:12px">${esc(e.message)}</div>`;
  }
}

function renderCollCard(card) {
  const fam = FAMILIES[card.trait] || "";
  const badgeClass = FAM_CLASS[fam] || "";
  const maxStat = Math.max(card.power, card.speed, card.wits);
  return `
    <div class="coll-card fade">
      ${card.imageUrl
        ? `<img class="coll-img" src="${esc(card.imageUrl)}" alt="${esc(card.name)}" onerror="this.outerHTML='<div class=coll-img-placeholder>No image</div>'">`
        : `<div class="coll-img-placeholder">No image</div>`}
      <div class="coll-body">
        <div class="coll-name">${esc(card.name)}</div>
        <span class="badge ${badgeClass}" style="font-size:9px">${esc(card.trait)} · ${esc(fam)}</span>
        <div class="coll-stats">
          <div class="coll-stat">
            <div class="coll-stat-label">POW</div>
            <div class="coll-stat-val${card.power===maxStat?" max":""}">${card.power}</div>
          </div>
          <div class="coll-stat">
            <div class="coll-stat-label">SPD</div>
            <div class="coll-stat-val${card.speed===maxStat?" max":""}">${card.speed}</div>
          </div>
          <div class="coll-stat">
            <div class="coll-stat-label">WIT</div>
            <div class="coll-stat-val${card.wits===maxStat?" max":""}">${card.wits}</div>
          </div>
        </div>
        ${card.description ? `<div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.45">${esc(card.description)}</div>` : ""}
      </div>
    </div>`;
}

// ── Deck Builder ──────────────────────────────────────────────────────────────
function toggleBuilder() {
  builderOpen = !builderOpen;
  const el = document.getElementById("deck-builder");
  const btn = document.getElementById("builder-toggle-btn");
  el.style.display = builderOpen ? "block" : "none";
  btn.textContent = builderOpen ? "Cancel" : "Build a Deck";
  if (builderOpen) renderBuilderGrid();
}

function renderBuilderGrid() {
  const grid = document.getElementById("builder-grid");
  if (!collectionCards.length) {
    grid.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:12px 0">Mint some cards first — you need at least 12 to build a deck.</div>';
    return;
  }
  grid.innerHTML = collectionCards.map(card => {
    const sel = deckSelection.has(card.id);
    const maxStat = Math.max(card.power, card.speed, card.wits);
    return `<div class="builder-card${sel ? " selected" : ""}" onclick="toggleCard('${esc(card.id)}')">
      <div class="builder-check">✓</div>
      ${card.imageUrl
        ? `<img style="width:100%;height:80px;object-fit:cover;display:block" src="${esc(card.imageUrl)}" alt="" onerror="this.style.display='none'">`
        : `<div style="width:100%;height:80px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)">No image</div>`}
      <div style="padding:6px 8px">
        <div style="font-size:11px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(card.name)}">${esc(card.name)}</div>
        <div style="display:flex;gap:3px">
          ${["power","speed","wits"].map(s => `<div style="flex:1;text-align:center;background:rgba(255,255,255,.04);border-radius:4px;padding:2px 0">
            <div style="font-size:7px;color:var(--muted);font-weight:700;text-transform:uppercase">${s.slice(0,3).toUpperCase()}</div>
            <div style="font-size:12px;font-weight:800${card[s]===maxStat?";color:var(--gold)":""}">${card[s]}</div>
          </div>`).join("")}
        </div>
      </div>
    </div>`;
  }).join("");
}

function toggleCard(cardId) {
  if (deckSelection.has(cardId)) {
    deckSelection.delete(cardId);
  } else {
    if (deckSelection.size >= 12) { showToast("Deck is full (12 cards)", true); return; }
    const card = collectionCards.find(c => c.id === cardId);
    if (card?.carriesSeven) {
      const sevenCount = collectionCards.filter(c => deckSelection.has(c.id) && c.carriesSeven).length;
      if (sevenCount >= 3) {
        document.getElementById("builder-warn").style.display = "block";
        setTimeout(() => { document.getElementById("builder-warn").style.display = "none"; }, 2000);
        return;
      }
    }
    deckSelection.add(cardId);
  }
  updateBuilderStatus();
  renderBuilderGrid();
}

function updateBuilderStatus() {
  const count = deckSelection.size;
  const sevens = collectionCards.filter(c => deckSelection.has(c.id) && c.carriesSeven).length;
  document.getElementById("builder-count").textContent = `${count} / 12`;
  document.getElementById("builder-sevens").textContent = `${sevens} / 3 sevens`;
  document.getElementById("save-deck-btn").disabled = count !== 12;
}

function clearSelection() {
  deckSelection.clear();
  updateBuilderStatus();
  renderBuilderGrid();
}

async function saveDeckSubmit() {
  const name = document.getElementById("deck-name-input").value.trim();
  if (!name) { showToast("Give your deck a name", true); return; }
  if (deckSelection.size !== 12) { showToast("Select exactly 12 cards", true); return; }

  const btn = document.getElementById("save-deck-btn");
  btn.disabled = true;
  btn.textContent = "Saving…";

  try {
    const res = await fetch("/api2/decks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ownerName, name, cardIds: [...deckSelection] }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Save failed");

    showToast(`"${name}" saved!`);
    document.getElementById("deck-name-input").value = "";
    deckSelection.clear();
    builderOpen = false;
    document.getElementById("deck-builder").style.display = "none";
    document.getElementById("builder-toggle-btn").textContent = "Build a Deck";
    updateBuilderStatus();
    loadDecks();
  } catch(e) {
    showToast(e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = "Save Deck";
  }
}

// ── Saved Decks ───────────────────────────────────────────────────────────────
async function loadDecks() {
  const area = document.getElementById("decks-area");
  area.innerHTML = '<div style="color:var(--muted);font-size:13px">Loading…</div>';
  try {
    const res = await fetch(`/api2/decks?owner=${encodeURIComponent(ownerName)}`);
    const data = await res.json();
    if (!data.decks?.length) {
      area.innerHTML = '<div style="color:var(--muted);font-size:13px">No decks yet.</div>';
      return;
    }
    area.innerHTML = data.decks.map(d => `
      <div class="saved-deck">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px">${esc(d.name)}</div>
          <div class="saved-deck-cards">${(d.cardNames || []).join(" · ")}</div>
        </div>
        <div style="font-size:11px;color:var(--muted);flex-shrink:0">${new Date(d.createdAt).toLocaleDateString()}</div>
      </div>`).join("");
  } catch(e) {
    area.innerHTML = `<div style="color:var(--red);font-size:13px">${esc(e.message)}</div>`;
  }
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

let toastTimer;
function showToast(msg, err) {
  const existing = document.querySelector(".toast");
  if (existing) existing.remove();
  clearTimeout(toastTimer);
  const el = document.createElement("div");
  el.className = "toast" + (err ? " err" : "");
  el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), 3500);
}
</script>
